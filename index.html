<body class="bg-gray-100 text-slate-800 antialiased min-h-screen flex flex-col">

        </div>
    </header>

    <!-- Main Content -->

        <!-- Score Modal / Sticky Banner (Hidden by default) -->

                    </svg>
                </div>

                <p class="text-gray-500 mb-6">Sonucunuz başarıyla hesaplandı.</p>
                <div class="bg-gray-50 rounded-xl p-6 mb-6 border border-gray-100">
                    <p class="text-sm text-gray-500 uppercase tracking-wider font-semibold mb-1">Puanınız</p>
                    <p id="scoreText" class="text-5xl font-black text-blue-600">100</p>
                </div>
                <p id="scoreDetailText" class="text-sm text-gray-600 mb-8">30 sorudan 30 doğru yaptınız.</p>
                <button onclick="closeModal()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-xl transition duration-200">
                    Cevapları İncele
                </button>
            </div>
        </div>

        // Fisher-Yates Shuffle algorithm
        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // Prepare Questions (shuffle options)
        const questions = rawQuestions.map((q, index) => {
            return {

                text: q.text,
                options: shuffleArray([...q.options]) // Shuffle a copy of the options
            };
        });

        // Render Questions

                // Question Title
                const questionTitle = document.createElement('h3');
                questionTitle.className = "text-lg font-semibold text-gray-800 mb-5 leading-relaxed";

                // Options Container
                const optionsGrid = document.createElement('div');
                optionsGrid.className = "space-y-3";

                q.options.forEach((opt, optIndex) => {
                    const label = document.createElement('label');
                    // Data attribute to track correctness for evaluation later
                    label.setAttribute('data-correct', opt.isCorrect);
                    label.className = "option-label flex items-center p-4 border border-gray-200 rounded-xl cursor-pointer hover:bg-blue-50 hover:border-blue-300 transition-all";
                    
                    const radioInput = document.createElement('input');
                    radioInput.type = "radio";
                    radioInput.name = `question-${qIndex}`;
                    radioInput.value = optIndex;
                    radioInput.className = "form-radio h-5 w-5 text-blue-600 focus:ring-blue-500 border-gray-300";

                    // Seçim yapıldığı anda seçeneğin rengini göster
                    radioInput.addEventListener('change', function() {
                        optionsGrid.querySelectorAll('.option-label').forEach(optionLabel => {
                            optionLabel.classList.remove(
                                'bg-green-100', 'border-green-500', 'text-green-800',
                                'bg-red-100', 'border-red-500', 'text-red-800'
                            );
                            optionLabel.classList.add('bg-white', 'border-gray-200');
                        });

                        if (opt.isCorrect) {
                            label.classList.remove('bg-white', 'border-gray-200');
                            label.classList.add('bg-green-100', 'border-green-500');
                            spanText.classList.remove('text-gray-700');
                            spanText.classList.add('text-green-800');
                        } else {
                            label.classList.remove('bg-white', 'border-gray-200');
                            label.classList.add('bg-red-100', 'border-red-500');
                            spanText.classList.remove('text-gray-700');
                            spanText.classList.add('text-red-800');
                        }
                    });
                    
                    const spanPrefix = document.createElement('span');
                    spanPrefix.className = "ml-3 mr-2 font-bold text-gray-500 w-5";
                    spanPrefix.innerText = `${alphabet[optIndex]})`;

                    const spanText = document.createElement('span');
                    spanText.className = "text-gray-700 font-medium";
                    spanText.innerText = opt.text;

                    label.appendChild(radioInput);
                    label.appendChild(spanPrefix);
                    label.appendChild(spanText);
                    optionsGrid.appendChild(label);
                });

                card.appendChild(optionsGrid);
                questionsContainer.appendChild(card);
            });
        }

            let correctCount = 0;
            const totalQuestions = questions.length;

            const cards = questionsContainer.children;

                let answeredCorrectly = false;

                    const radio = radios[idx];
                    radio.disabled = true;
                    label.classList.remove('hover:bg-blue-50', 'hover:border-blue-300', 'cursor-pointer');
                    label.classList.add('cursor-not-allowed');

                    const isCorrect = label.getAttribute('data-correct') === 'true';
                    
                    if (radio.checked) {
                        if (isCorrect) {
                            // User selected correctly
                            answeredCorrectly = true;
                            label.classList.add('bg-green-100', 'border-green-500');
                            label.classList.remove('border-gray-200');
                            label.querySelector('span.text-gray-700').classList.add('text-green-800');
                        } else {
                            // User selected wrongly
                            label.classList.add('bg-red-100', 'border-red-500');
                            label.classList.remove('border-gray-200');
                            label.querySelector('span.text-gray-700').classList.add('text-red-800');
                        }
                    } else if (isCorrect) {
                        // Highlight the correct answer anyway if user didn't pick it or picked wrong
                        label.classList.add('bg-green-50', 'border-green-400');
                        label.classList.remove('border-gray-200');
                        label.querySelector('span.text-gray-700').classList.add('text-green-700');
                    }
                });

                if (answeredCorrectly) {
                    correctCount++;
                }
            }

            // Calculate Score (100 / 30 = 3.333... per question)
            // Round to 2 decimal places, or 0 decimals if it's a whole number
            let score = (correctCount / totalQuestions) * 100;
            score = Number.isInteger(score) ? score : score.toFixed(2);

            // Display Modal
            const modal = document.getElementById('resultModal');
            const scoreText = document.getElementById('scoreText');
            const scoreDetailText = document.getElementById('scoreDetailText');
            const submitBtn = document.getElementById('submitBtn');
            const modalIcon = document.getElementById('modalIcon');

            scoreText.innerText = score;
            scoreDetailText.innerText = `${totalQuestions} sorudan ${correctCount} doğru yaptınız.`;
            
            // Icon and color change based on score
            if(score >= 50) {
                modalIcon.classList.replace('bg-red-100', 'bg-green-100');
                modalIcon.innerHTML = `<svg class="h-10 w-10 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>`;
                scoreText.classList.replace('text-blue-600', 'text-green-600');
                scoreText.classList.replace('text-red-600', 'text-green-600');
            } else {
                modalIcon.classList.replace('bg-green-100', 'bg-red-100');
                modalIcon.classList.replace('bg-blue-100', 'bg-red-100');
                modalIcon.innerHTML = `<svg class="h-10 w-10 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>`;
                scoreText.classList.replace('text-blue-600', 'text-red-600');
                scoreText.classList.replace('text-green-600', 'text-red-600');
            }

            modal.classList.remove('hidden');
            
            // Change button state
            submitBtn.disabled = true;
            submitBtn.innerText = "Sınav Bitti";
            submitBtn.classList.replace('bg-blue-600', 'bg-gray-400');
            submitBtn.classList.replace('hover:bg-blue-700', 'hover:bg-gray-400');
            submitBtn.classList.remove('hover:-translate-y-1', 'shadow-lg');
        });

        function closeModal() {
            document.getElementById('resultModal').classList.add('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Initialize quiz on load
        document.addEventListener('DOMContentLoaded', renderQuiz);

    </script>
</body>
</html>
