        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // Karıştırılmış sorular dizisini oluştur
        const questions = rawQuestions.map((q, index) => {
            return {
                id: index,
                text: q.text,
                explanation: q.explanation,
                options: shuffleArray([...q.options])
            };
        });

        const questionsContainer = document.getElementById('questionsContainer');

        // Soruları ekrana basan fonksiyon
        function renderQuiz() {
            const alphabet = ['A', 'B', 'C', 'D'];
            
            questions.forEach((q, qIndex) => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow-sm p-6 md:p-8 border border-gray-100 hover:shadow-md transition-shadow relative";
                
                const questionTitle = document.createElement('h3');
                questionTitle.className = "text-lg font-semibold text-gray-800 mb-5 leading-relaxed";
                questionTitle.innerHTML = `<span class="text-blue-600 mr-2">Soru ${qIndex + 1}:</span> ${q.text}`;
                card.appendChild(questionTitle);

                const optionsGrid = document.createElement('div');
                optionsGrid.className = "space-y-3";

                // Şıkları oluştur
                q.options.forEach((opt, optIndex) => {
                    const label = document.createElement('label');
                    label.setAttribute('data-correct', opt.isCorrect);
                    label.className = "option-label flex items-center p-4 border border-gray-200 rounded-xl cursor-pointer hover:bg-blue-50 hover:border-blue-300 transition-all";
                    
                    const radioInput = document.createElement('input');
                    radioInput.type = "radio";
                    radioInput.name = `question-${qIndex}`;
                    radioInput.value = optIndex;
                    radioInput.className = "form-radio h-5 w-5 text-blue-600 focus:ring-blue-500 border-gray-300";

                    const spanPrefix = document.createElement('span');
                    spanPrefix.className = "ml-3 mr-2 font-bold text-gray-500 w-5";
                    spanPrefix.innerText = `${alphabet[optIndex]})`;

                    const spanText = document.createElement('span');
                    spanText.className = "text-gray-700 font-medium opt-text";
                    spanText.innerText = opt.text;

                    label.appendChild(radioInput);
                    label.appendChild(spanPrefix);
                    label.appendChild(spanText);
                    optionsGrid.appendChild(label);

                    // --- İŞARETLEDİĞİ AN ÇALIŞACAK MANTIK ---
                    radioInput.addEventListener('change', function() {
                        const allLabels = optionsGrid.querySelectorAll('.option-label');
                        const allRadios = optionsGrid.querySelectorAll('input[type="radio"]');
                        
                        // 1) O sorudaki diğer tüm şıkları kilitle (bir kere cevaplanabilir)
                        allRadios.forEach(radio => {
                            radio.disabled = true;
                            radio.closest('label').classList.remove('cursor-pointer', 'hover:bg-blue-50', 'hover:border-blue-300');
                            radio.closest('label').classList.add('cursor-not-allowed');
                        });

                        // 2) Renklendirmeleri yap
                        allLabels.forEach(lbl => {
                            const isCorrect = lbl.getAttribute('data-correct') === 'true';
                            const rad = lbl.querySelector('input[type="radio"]');
                            const txt = lbl.querySelector('.opt-text');

                            if (rad.checked) {
                                // Kullanıcının seçtiği şık
                                if (isCorrect) {
                                    // Doğruysa Yeşil yap
                                    lbl.classList.remove('border-gray-200');
                                    lbl.classList.add('bg-green-100', 'border-green-500');
                                    txt.classList.replace('text-gray-700', 'text-green-800');
                                } else {
                                    // Yanlışsa Kırmızı yap
                                    lbl.classList.remove('border-gray-200');
                                    lbl.classList.add('bg-red-100', 'border-red-500');
                                    txt.classList.replace('text-gray-700', 'text-red-800');
                                }
                            } else if (isCorrect) {
                                // Kullanıcı yanlış seçmiş olsa bile doğru şıkkı açık yeşil göster
                                lbl.classList.remove('border-gray-200');
                                lbl.classList.add('bg-green-50', 'border-green-400', 'border-dashed');
                                txt.classList.replace('text-gray-700', 'text-green-700');
                            }
                        });

                        // 3) Açıklamayı (Çalışma Notunu) anında göster
                        explanationDiv.classList.remove('hidden');
                    });
                });

                card.appendChild(optionsGrid);
                
                // Explanation Container (Başlangıçta Gizli)
                const explanationDiv = document.createElement('div');
                explanationDiv.className = "explanation hidden mt-6 p-4 bg-blue-50 border border-blue-200 rounded-xl text-blue-800 text-sm font-medium leading-relaxed";
                explanationDiv.innerHTML = `<strong>💡 Doğru Cevap ve Açıklama:</strong> ${q.explanation}`;
                card.appendChild(explanationDiv);

                questionsContainer.appendChild(card);
            });
        }

        // Sayfa yüklendiğinde soruları bas
        document.addEventListener('DOMContentLoaded', renderQuiz);

    </script>
</body>
</html>
